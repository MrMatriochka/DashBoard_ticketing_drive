<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#0B1F4B;--blue:#2F6FD0;--surface:#E9EEF5;--card:#EEF2F8;--sd:rgba(163,177,198,.55);--sl:rgba(255,255,255,.9);
--raised:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);--inset:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);--muted:#5B6678}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:#1A2333;font:14px/1.45 Inter,system-ui,sans-serif}
.q{max-width:1200px;margin:0 auto;padding:10px 16px;font-size:13px;color:var(--muted)}.q b{color:var(--navy)}
header{background:var(--navy);color:#fff}.in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:0 16px 24px}
.barre{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:10px;box-shadow:var(--inset)}.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:var(--raised);outline:1.5px solid var(--blue);color:var(--navy);font-weight:600}
.switch{flex-direction:row;align-items:center;gap:8px}
.outils{margin-left:auto;display:flex;gap:6px}.outils button{width:36px;height:36px;border-radius:10px;border:1px solid #CBD4E1;background:var(--card);box-shadow:var(--raised);font:600 16px Inter,sans-serif;color:var(--navy);cursor:pointer}
.outils .large{width:auto;padding:0 12px;font-size:13px}
#vue{position:relative;height:620px;margin-top:12px;border-radius:14px;background:var(--card);box-shadow:var(--inset);overflow:hidden;cursor:grab;touch-action:none}
#vue.glisse{cursor:grabbing}
#toile{position:absolute;left:0;top:0;transform-origin:0 0}
#liens{position:absolute;left:0;top:0;z-index:0;overflow:visible;pointer-events:none}
.arbre{position:relative;z-index:1;display:flex;align-items:center;gap:140px;padding:40px}
.cote{display:flex;flex-direction:column;gap:28px}
.bloc{display:flex;align-items:center;gap:70px}.gauche .bloc{flex-direction:row-reverse}
.hub{flex-shrink:0;width:120px;height:120px;border-radius:50%;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;box-shadow:var(--raised)}
.hub span{font-size:30px;font-weight:600;line-height:1.1}
.branche{flex-shrink:0;min-width:150px;padding:10px 14px;border-radius:14px;color:#fff;background:var(--c);box-shadow:var(--raised);transform-origin:center}
.branche b{display:block;font-size:15px}.branche .n{font-size:26px;font-weight:600;line-height:1.1}.branche small{display:block;font-size:12px;opacity:.95}
.cartes{display:grid;grid-template-columns:repeat(2,200px);gap:10px}
.carte{all:unset;box-sizing:border-box;width:200px;height:72px;padding:8px 10px;border-radius:12px;background:#F7F9FC;border:1px solid #CBD4E1;border-left:5px solid var(--c);box-shadow:var(--raised);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.carte:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.carte .l1{display:flex;justify-content:space-between;font-size:12px}.carte .l1 b{color:var(--navy)}
.p-Haute{color:#B23B35;font-weight:700}.p-Moyenne{color:var(--muted);font-weight:600}.p-Basse{color:var(--muted)}
.carte{overflow:hidden}.carte>span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.carte .t{font-size:13px;font-weight:500}
.carte .s{font-size:11.5px;color:var(--muted)}.carte .s i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--st)}
/* Vue d'ensemble : cartes réduites à des tuiles de couleur, compteurs des branches agrandis pour rester lisibles */
.ensemble .carte,.ensemble .lien-carte{visibility:hidden}.ensemble .branche{cursor:zoom-in}
.ensemble .branche,.ensemble .hub{transform:scale(var(--k))}.gauche .branche{transform-origin:right center}.droite .branche{transform-origin:left center}
.niveau{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--card);padding:4px 10px;border-radius:999px;box-shadow:var(--raised)}
.legende{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.fiche{position:fixed;z-index:20;top:0;right:0;bottom:0;width:360px;overflow:auto;background:var(--card);box-shadow:-8px 0 20px var(--sd);padding:18px;transform:translateX(105%);transition:transform .2s}
.fiche.ouverte{transform:none}.fiche .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}.fiche dt{color:var(--muted)}.fiche dd{margin:0}
</style></head><body>
<p class="q"><b>Prototype v3.</b> Liens derrière les cartes, textes tronqués sur une ligne, <b>vue d'ensemble = Hub + grosses branches seulement</b> (clic sur une branche = zoom dessus), clic sur une carte = fiche. Dézoome sous 60 % pour la vue d'ensemble.</p>
<header><div class="in">Hub tickets <span style="font-weight:400;opacity:.8">25 tickets</span></div></header>
<main>
<div class="barre">
 <label>Grouper par<div class="seg" id="grp"><button aria-pressed="true" data-g="statut">Statut</button><button data-g="categorie">Catégorie</button><button data-g="assigne">Personne</button></div></label>

</div>
<div id="vue"><div id="toile"><svg id="liens"></svg><div class="arbre" id="arbre"></div></div><span class="niveau" id="niveau"></span></div>

13:00:00.000Z","motif":"","anomalies":[]},{"ligne":23,"id":"TK-022","creeLe":"2026-11-14T09:00:00.000Z","titre":"Graphique d'évolution des délais de traitement","description":"[DÉMO] Suivre le délai moyen entre création et clôture.","categorie":"Données","priorite":"Moyenne","demandeur":"Théo Rivière","assigne":"Léa Bonnet","statut":"À valider","majLe":"2026-11-14T14:00:00.000Z","motif":"","anomalies":[]},{"ligne":24,"id":"TK-023","creeLe":"2026-11-15T10:00:00.000Z","titre":"Réinitialiser l'accès à l'agenda partagé","description":"[DÉMO] Les droits de modification de l'agenda d'équipe ont disparu.","categorie":"Support","priorite":"Haute","demandeur":"Léa Bonnet","assigne":"Malik Durand","statut":"À valider","majLe":"2026-11-15T15:00:00.000Z","motif":"","anomalies":[]},{"ligne":25,"id":"TK-024","creeLe":"2026-11-15T11:00:00.000Z","titre":"Tutoriel vidéo sur les filtres Sheets","description":"[DÉMO] Vidéo courte (5 min) sur les vues filtrées.","categorie":"Formation","priorite":"Basse","demandeur":"Inès Marchal","assigne":"Théo Rivière","statut":"À valider","majLe":"2026-11-15T16:00:00.000Z","motif":"","anomalies":[]},{"ligne":26,"id":"TK-025","creeLe":"2026-11-16T08:00:00.000Z","titre":"Automatiser l'archivage des tickets terminés","description":"[DÉMO] Déplacer les tickets terminés depuis plus de 90 jours.","categorie":"Automatisation","priorite":"Moyenne","demandeur":"Malik Durand","assigne":"Léa Bonnet","statut":"À valider","majLe":"2026-11-16T13:00:00.000Z","motif":"","anomalies":[]}];
const ST={'À valider':'#8A94A6','Validé':'#3D7DD8','En cours':'#5B5FC7','Bloqué':'#D2544E','Terminé':'#1F9E89','Rejeté':'#4A4F5A'};
const CAT={'Données':'#2F6FD0','Automatisation':'#C2410C','Support':'#7C3AED','Formation':'#0E7490'};
const OUV=['À valider','Validé','En cours','Bloqué'],ORDRE_P={Haute:0,Moyenne:1,Basse:2};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const age=t=>Math.floor((Date.now()-new Date(t.creeLe))/864e5);
let grp='statut',clos=false,z=1,x=0,y=0;
const vue=document.getElementById('vue'),toile=document.getElementById('toile');
function rendre(){
 const vis=T.filter(t=>clos||OUV.includes(t.statut));
 const couleurCarte=t=>grp==='statut'?CAT[t.categorie]:ST[t.statut];
 const noms=[...new Set(vis.map(t=>t[grp]||'—'))];
 const groupes=noms.map(n=>({n,tk:vis.filter(t=>(t[grp]||'—')===n).sort((a,b)=>ORDRE_P[a.priorite]-ORDRE_P[b.priorite])}));
 // répartition équilibrée gauche / droite selon le nombre de tickets
 const g=[],d=[];let sg=0,sd=0;groupes.slice().sort((a,b)=>b.tk.length-a.tk.length).forEach(b=>{if(sd<=sg){d.push(b);sd+=b.tk.length}else{g.push(b);sg+=b.tk.length}});
 const bloc=b=>{const hautes=b.tk.filter(t=>t.priorite==='Haute').length,bloques=b.tk.filter(t=>t.statut==='Bloqué').length;
  const detail=[hautes&&hautes+' haute'+(hautes>1?'s':''),grp!=='statut'&&bloques&&bloques+' bloqué'+(bloques>1?'s':'')].filter(Boolean).join(' · ');
  return '<div class="bloc"><div class="branche" style="--c:'+(grp==='statut'?ST[b.n]:'#1C3D7A')+'"><b>'+esc(b.n)+'</b><span class="n">'+b.tk.length+'</span><small>'+(detail||'&nbsp;')+'</small></div><div class="cartes">'+
  b.tk.map(t=>'<button class="carte p-'+t.priorite+'-tuile" data-id="'+t.id+'" style="--c:'+couleurCarte(t)+';--st:'+ST[t.statut]+'"><span class="l1"><b>'+esc(t.id)+'</b><span class="p-'+t.priorite+'">'+t.priorite+'</span></span><span class="t">'+esc(t.titre)+'</span><span class="s"><i></i>'+esc(t.statut)+' · '+age(t)+' j</span></button>').join('')+'</div></div>';};
 document.getElementById('arbre').innerHTML='<div class="cote gauche">'+g.map(bloc).join('')+'</div><div class="hub">Hub<span>'+vis.length+'</span></div><div class="cote droite">'+d.map(bloc).join('')+'</div>';
 const pal=grp==='statut'?CAT:ST;document.getElementById('leg').innerHTML='Couleur des cartes : '+Object.entries(pal).filter(([k])=>grp==='statut'||clos||OUV.includes(k)).map(([k,c])=>'<span><i style="background:'+c+'"></i>'+k+'</span>').join('');
 liens();ajuster();
}
function centre(el,cote){const r=el.getBoundingClientRect(),o=toile.getBoundingClientRect();return{x:((cote==='g'?r.left:cote==='d'?r.right:r.left+r.width/2)-o.left)/z,y:(r.top+r.height/2-o.top)/z};}
function liens(){const a=document.getElementById('arbre'),svg=document.getElementById('liens');svg.setAttribute('width',a.offsetWidth);svg.setAttribute('height',a.offsetHeight);
 const hub=document.querySelector('.hub');let p='';let pb='',pc='',courant;const c=(A,B,k)=>{courant=k;const mx=(A.x+B.x)/2;const seg='M'+A.x+','+A.y+' C'+mx+','+A.y+' '+mx+','+B.y+' '+B.x+','+B.y+' ';if(k==='b')pb+=seg;else pc+=seg;};
 const sauve=toile.style.transform;toile.style.transform='none';const zz=z;z=1;
 document.querySelectorAll('.bloc').forEach(bl=>{const gauche=bl.closest('.gauche'),br=bl.querySelector('.branche');
  c(centre(hub,gauche?'g':'d'),centre(br,gauche?'d':'g'),'b');
  bl.querySelectorAll('.carte').forEach(ca=>c(centre(br,gauche?'g':'d'),centre(ca,gauche?'d':'g'),'c'));});
 z=zz;toile.style.transform=sauve;svg.innerHTML='<path d="'+pb+'" fill="none" stroke="#AEB9CA" stroke-width="2"/><path class="lien-carte" d="'+pc+'" fill="none" stroke="#C3CCDA" stroke-width="1.2"/>';}
function appliquer(){toile.style.transform='translate('+x+'px,'+y+'px) scale('+z+')';toile.style.setProperty('--k',Math.min(1.6,.6/z));
 const ens=z<.6;toile.classList.toggle('ensemble',ens);document.getElementById('niveau').textContent=(ens?"Vue d'ensemble":'Détail')+' · '+Math.round(z*100)+' %';}
function ajuster(){const a=document.getElementById('arbre');z=Math.min(1,vue.clientWidth/a.offsetWidth,vue.clientHeight/a.offsetHeight);
 x=(vue.clientWidth-a.offsetWidth*z)/2;y=(vue.clientHeight-a.offsetHeight*z)/2;appliquer();}
function zoomer(f,cx=vue.clientWidth/2,cy=vue.clientHeight/2){const nz=Math.min(1.6,Math.max(.4,z*f));x=cx-(cx-x)*nz/z;y=cy-(cy-y)*nz/z;z=nz;appliquer();}
vue.addEventListener('wheel',e=>{e.preventDefault();const r=vue.getBoundingClientRect();zoomer(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
const ptr=new Map();let dist=0,bouge=false,depart=null;
